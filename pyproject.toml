[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rotdd-tools"
version = "0.1.0"
description = "Research and text-mapping utilities for Shining Force: Resurrection of the Dark Dragon."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rotdd-text-tools = "rotdd_tools.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
